<script>
    // Link to your published Google Sheet CSV
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQe9aUnSWxb5rK3ZvwOM9o5_zyl1B2filBqKUnJSQ4g9RNRY47qsXRgxfehSLKV45SkPHebQs1_ta-W/pub?gid=0&single=true&output=csv';

    // Holds our active schedule data
    let activeSchedule = [];

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    // Converts "HH:MM" (or "H:MM") string to total minutes from midnight
    function timeToMinutes(timeStr) {
      if (!timeStr) return -1;
      // Clean up whitespace and any hidden characters
      const cleanStr = timeStr.trim().replace(/[^\d:]/g, '');
      const parts = cleanStr.split(':');
      if (parts.length < 2) return -1;
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    async function fetchSchedule() {
      try {
        // Force fresh fetch using cache-busting timestamp
        const cacheBuster = '&nocache=' + new Date().getTime();
        const response = await fetch(csvUrl + cacheBuster, { cache: 'no-store' });
        const data = await response.text();
        
        // Parse raw CSV lines
        const lines = data.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        const parsedSchedule = [];

        // Loop through rows skipping header
        for (let i = 1; i < lines.length; i++) {
          // Robust CSV line splitting (handles quotes)
          const cols = lines[i].split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
          
          if (cols.length >= 3 && cols[0] && cols[1]) {
            const startMin = timeToMinutes(cols[0]);
            const endMin = timeToMinutes(cols[1]);

            // Only add valid time entries
            if (startMin !== -1 && endMin !== -1) {
              parsedSchedule.push({
                start: cols[0],
                end: cols[1],
                event: cols[2] || 'Activity',
                startMin: startMin,
                endMin: endMin
              });
            }
          }
        }

        // Sort schedule chronologically to ensure correct sequence
        parsedSchedule.sort((a, b) => a.startMin - b.startMin);

        // Always overwrite activeSchedule with fresh data
        if (parsedSchedule.length > 0) {
          activeSchedule = parsedSchedule;
          // Force immediate re-render on new data pull
          renderSchedule();
        }

      } catch (err) {
        console.error("Error fetching fresh schedule:", err);
      }
    }

    function renderSchedule() {
      if (activeSchedule.length === 0) return;

      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();

      let current = null;
      let next = null;

      // Find current active slot or next upcoming slot
      for (let i = 0; i < activeSchedule.length; i++) {
        const item = activeSchedule[i];
        
        if (currentMin >= item.startMin && currentMin < item.endMin) {
          current = item;
          next = activeSchedule[i + 1] || null;
          break;
        } else if (currentMin < item.startMin) {
          next = item;
          break;
        }
      }

      // Update Current Event Card
      const currentTitleEl = document.getElementById('current-event');
      const currentTimeEl = document.getElementById('current-time');
      
      if (current) {
        currentTitleEl.innerText = current.event;
        currentTimeEl.innerText = `${current.start} - ${current.end}`;
      } else {
        currentTitleEl.innerText = "No Scheduled Activity";
        currentTimeEl.innerText = "";
      }

      // Update Next Event Card
      const nextTitleEl = document.getElementById('next-event');
      const nextTimeEl = document.getElementById('next-time');

      if (next) {
        nextTitleEl.innerText = next.event;
        nextTimeEl.innerText = `Starts at ${next.start}`;
      } else {
        nextTitleEl.innerText = "Layla Tov!!!";
        nextTimeEl.innerText = "";
      }
    }

    // Run on boot
    fetchSchedule();

    // Check time position every 5 seconds for immediate activity switching
    setInterval(renderSchedule, 5000);

    // Fetch updated CSV data from Google every 15 seconds
    setInterval(fetchSchedule, 15000);
  </script>
